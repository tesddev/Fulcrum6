version: 2
updates:
  # Backend npm dependencies
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
    open-pull-requests-limit: 10
    reviewers:
      - "tesddev"
    labels:
      - "dependencies"
      - "backend"
    commit-message:
      prefix: "chore(backend):"
      prefix-development: "chore(backend-dev):"
      include: "scope"
    rebase-strategy: "auto"
    allow:
      - dependency-type: "production"
      - dependency-type: "development"
    groups:
      security-patches:
        dependency-type: "production"
        update-types:
          - "patch"
      dev-security-patches:
        dependency-type: "development"
        update-types:
          - "patch"

  # Frontend npm dependencies  
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
    open-pull-requests-limit: 10
    reviewers:
      - "tesddev"
    labels:
      - "dependencies"
      - "frontend"
    commit-message:
      prefix: "chore(frontend):"
      prefix-development: "chore(frontend-dev):"
      include: "scope"
    rebase-strategy: "auto"
    allow:
      - dependency-type: "production"
      - dependency-type: "development"
    groups:
      security-patches:
        dependency-type: "production"
        update-types:
          - "patch"
      dev-security-patches:
        dependency-type: "development"
        update-types:
          - "patch"
